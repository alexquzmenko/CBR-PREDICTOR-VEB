name: CI

on:
  pull_request:
  push:
    branches:
      - demo/project-upload
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m compileall src app scripts

      - name: Config smoke check
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for p in ["configs/dataset.yaml", "configs/modeling.yaml"]:
              assert Path(p).exists(), f"Missing {p}"
              with open(p, "r", encoding="utf-8") as f:
                  yaml.safe_load(f)
          print("Config files are valid YAML.")
          PY
