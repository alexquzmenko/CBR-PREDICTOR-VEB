name: CD to Yandex Serverless Containers

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: cbr-predictor
  DEFAULT_REGISTRY_ID: crp80kqtu9obombh8iv7

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare service account key
        env:
          YC_SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os

          raw = os.environ.get("YC_SA_KEY_JSON", "").strip()
          if not raw:
              raise RuntimeError("Secret YC_SA_KEY_JSON is empty.")

          candidates = [raw]
          try:
              candidates.append(base64.b64decode(raw).decode("utf-8"))
          except Exception:
              pass

          parsed = None
          for c in candidates:
              try:
                  parsed = json.loads(c)
                  break
              except Exception:
                  try:
                      parsed = json.loads(c.replace("\\n", "\n"))
                      break
                  except Exception:
                      continue

          if not parsed:
              raise RuntimeError(
                  "YC_SA_KEY_JSON is not valid JSON key. Paste full JSON key content."
              )
          required = {"id", "service_account_id", "private_key", "public_key"}
          missing = [k for k in required if k not in parsed]
          if missing:
              raise RuntimeError(
                  "YC_SA_KEY_JSON has invalid structure. Missing fields: "
                  + ", ".join(missing)
              )
          with open("key.json", "w", encoding="utf-8") as f:
              json.dump(parsed, f)
          print("key.json prepared")
          PY

      - name: Login to Yandex Container Registry
        env:
          YC_REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
        run: |
          REGISTRY_ID="${YC_REGISTRY_ID:-$DEFAULT_REGISTRY_ID}"
          echo "REGISTRY_ID=$REGISTRY_ID" >> $GITHUB_ENV
          docker login --username json_key --password-stdin cr.yandex < key.json

      - name: Build image
        run: |
          IMAGE_URI=cr.yandex/${REGISTRY_ID}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker build -t "$IMAGE_URI" .
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Push image
        run: |
          docker push "$IMAGE_URI"
          docker tag "$IMAGE_URI" cr.yandex/${REGISTRY_ID}/${{ env.IMAGE_NAME }}:latest
          docker push cr.yandex/${REGISTRY_ID}/${{ env.IMAGE_NAME }}:latest

      - name: Verify SA key file
        run: |
          set -e
          KEY_PATH="$(pwd)/key.json"
          if [ ! -s "$KEY_PATH" ]; then
            echo "key.json is missing or empty"
            exit 1
          fi
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "key.json present: $(wc -c < "$KEY_PATH") bytes"

      - name: Deploy revision via Yandex Cloud REST API
        env:
          KEY_PATH: ${{ env.KEY_PATH }}
          IMAGE_URI: ${{ env.IMAGE_URI }}
          YC_SERVERLESS_CONTAINER_ID: ${{ secrets.YC_SERVERLESS_CONTAINER_ID }}
          YC_BUCKET_NAME: ${{ secrets.YC_BUCKET_NAME }}
        run: |
          set -e
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "pyjwt>=2.8" "cryptography>=42"
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          import jwt as pyjwt

          KEY_PATH = os.environ["KEY_PATH"]
          IMAGE_URI = os.environ["IMAGE_URI"]
          CONTAINER_ID = os.environ["YC_SERVERLESS_CONTAINER_ID"]
          BUCKET_NAME = os.environ.get("YC_BUCKET_NAME", "")

          with open(KEY_PATH, "r", encoding="utf-8") as f:
              key = json.load(f)

          now = int(time.time())
          jwt_payload = {
              "iss": key["service_account_id"],
              "aud": "https://iam.api.cloud.yandex.net/iam/v1/tokens",
              "iat": now,
              "exp": now + 360,
          }
          jwt_encoded = pyjwt.encode(
              jwt_payload,
              key["private_key"],
              algorithm="PS256",
              headers={"kid": key["id"]},
          )

          req = urllib.request.Request(
              "https://iam.api.cloud.yandex.net/iam/v1/tokens",
              data=json.dumps({"jwt": jwt_encoded}).encode("utf-8"),
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=20) as resp:
              iam_token = json.loads(resp.read().decode("utf-8"))["iamToken"]

          print("::add-mask::" + iam_token)
          print(f"IAM token issued (length={len(iam_token)})")

          deploy_body = {
              "container_id": CONTAINER_ID,
              "resources": {
                  "memory": str(1 * 1024 * 1024 * 1024),
                  "cores": "1",
              },
              "execution_timeout": "60s",
              "image_spec": {
                  "image_url": IMAGE_URI,
                  "environment": {
                      "PORT": "8080",
                      "APP_ENV": "prod",
                      "YC_BUCKET_NAME": BUCKET_NAME,
                  },
              },
          }

          deploy_url = (
              "https://serverless-containers.api.cloud.yandex.net/containers/v1/"
              "revisions:deploy"
          )

          deploy_req = urllib.request.Request(
              deploy_url,
              data=json.dumps(deploy_body).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + iam_token,
                  "Content-Type": "application/json",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(deploy_req, timeout=60) as resp:
                  op = json.loads(resp.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode("utf-8", errors="replace")
              raise SystemExit(
                  f"deployRevision failed: HTTP {exc.code}\n{detail}"
              )

          op_id = op.get("id")
          if not op_id:
              raise SystemExit(
                  "Unexpected deployRevision response (no operation id):\n"
                  + json.dumps(op, indent=2, ensure_ascii=False)
              )
          print(f"Operation started: {op_id}")

          op_url = f"https://operation.api.cloud.yandex.net/operations/{op_id}"
          deadline = time.time() + 8 * 60
          while True:
              if time.time() > deadline:
                  raise SystemExit("Timeout waiting for deploy operation to finish")
              poll_req = urllib.request.Request(
                  op_url,
                  headers={"Authorization": "Bearer " + iam_token},
              )
              try:
                  with urllib.request.urlopen(poll_req, timeout=20) as resp:
                      status = json.loads(resp.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise SystemExit(
                      f"Operation poll failed: HTTP {exc.code}\n{detail}"
                  )

              if status.get("done"):
                  if status.get("error"):
                      raise SystemExit(
                          "Deploy operation finished with error:\n"
                          + json.dumps(status["error"], indent=2, ensure_ascii=False)
                      )
                  rev = status.get("response", {})
                  rev_id = rev.get("id") or rev.get("revisionId") or "<unknown>"
                  print(f"Deploy succeeded. Revision id: {rev_id}")
                  break
              time.sleep(5)
          PY
