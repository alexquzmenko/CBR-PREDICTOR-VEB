name: CD to Yandex Serverless Containers

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: cbr-predictor

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare service account key
        env:
          YC_SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os

          raw = os.environ.get("YC_SA_KEY_JSON", "").strip()
          if not raw:
              raise RuntimeError("Secret YC_SA_KEY_JSON is empty.")

          candidates = [raw]
          try:
              candidates.append(base64.b64decode(raw).decode("utf-8"))
          except Exception:
              pass

          parsed = None
          for c in candidates:
              try:
                  parsed = json.loads(c)
                  break
              except Exception:
                  try:
                      parsed = json.loads(c.replace("\\n", "\n"))
                      break
                  except Exception:
                      continue

          if not parsed:
              raise RuntimeError(
                  "YC_SA_KEY_JSON is not valid JSON key. Paste full JSON key content."
              )
          required = {"id", "service_account_id", "private_key", "public_key"}
          missing = [k for k in required if k not in parsed]
          if missing:
              raise RuntimeError(
                  "YC_SA_KEY_JSON has invalid structure. Missing fields: "
                  + ", ".join(missing)
              )
          with open("key.json", "w", encoding="utf-8") as f:
              json.dump(parsed, f)
          print("key.json prepared")
          PY

      - name: Login to Yandex Container Registry
        run: |
          docker login --username json_key --password-stdin cr.yandex < key.json

      - name: Build image
        run: |
          IMAGE_URI=cr.yandex/${{ secrets.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker build -t "$IMAGE_URI" .
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Push image
        run: |
          docker push "$IMAGE_URI"
          docker tag "$IMAGE_URI" cr.yandex/${{ secrets.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:latest
          docker push cr.yandex/${{ secrets.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:latest

      - name: Install yc CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i /usr/local/bin
          yc --version

      - name: Configure yc auth
        run: |
          yc config profile activate default || true
          yc auth activate-service-account-key --key-file key.json
          yc config profile create ci-profile || true
          yc config set service-account-key key.json
          yc config set cloud-id ${{ secrets.YC_CLOUD_ID }}
          yc config set folder-id ${{ secrets.YC_FOLDER_ID }}

      - name: Deploy new revision to serverless container
        run: |
          yc serverless container revision deploy \
            --container-id ${{ secrets.YC_SERVERLESS_CONTAINER_ID }} \
            --image "$IMAGE_URI" \
            --cores 1 \
            --memory 1GB \
            --execution-timeout 60s \
            --environment PORT=8080 \
            --environment APP_ENV=prod \
            --environment YC_BUCKET_NAME=${{ secrets.YC_BUCKET_NAME }}
