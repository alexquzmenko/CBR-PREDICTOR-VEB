name: CD to Yandex Serverless Containers

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: cbr-predictor
  DEFAULT_REGISTRY_ID: crp80kqtu9obombh8iv7

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare service account key
        env:
          YC_SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os

          raw = os.environ.get("YC_SA_KEY_JSON", "").strip()
          if not raw:
              raise RuntimeError("Secret YC_SA_KEY_JSON is empty.")

          candidates = [raw]
          try:
              candidates.append(base64.b64decode(raw).decode("utf-8"))
          except Exception:
              pass

          parsed = None
          for c in candidates:
              try:
                  parsed = json.loads(c)
                  break
              except Exception:
                  try:
                      parsed = json.loads(c.replace("\\n", "\n"))
                      break
                  except Exception:
                      continue

          if not parsed:
              raise RuntimeError(
                  "YC_SA_KEY_JSON is not valid JSON key. Paste full JSON key content."
              )
          required = {"id", "service_account_id", "private_key", "public_key"}
          missing = [k for k in required if k not in parsed]
          if missing:
              raise RuntimeError(
                  "YC_SA_KEY_JSON has invalid structure. Missing fields: "
                  + ", ".join(missing)
              )
          with open("key.json", "w", encoding="utf-8") as f:
              json.dump(parsed, f)
          print("key.json prepared")
          PY

      - name: Login to Yandex Container Registry
        env:
          YC_REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
        run: |
          REGISTRY_ID="${YC_REGISTRY_ID:-$DEFAULT_REGISTRY_ID}"
          echo "REGISTRY_ID=$REGISTRY_ID" >> $GITHUB_ENV
          docker login --username json_key --password-stdin cr.yandex < key.json

      - name: Build image
        run: |
          IMAGE_URI=cr.yandex/${REGISTRY_ID}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker build -t "$IMAGE_URI" .
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Push image
        run: |
          docker push "$IMAGE_URI"
          docker tag "$IMAGE_URI" cr.yandex/${REGISTRY_ID}/${{ env.IMAGE_NAME }}:latest
          docker push cr.yandex/${REGISTRY_ID}/${{ env.IMAGE_NAME }}:latest

      - name: Install yc CLI
        run: |
          set -e

          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh -o /tmp/yc-install.sh

          mkdir -p "$HOME/yandex-cloud"
          bash /tmp/yc-install.sh -i "$HOME/yandex-cloud" -n || true

          source "$HOME/.bashrc" || true

          YC_BIN=""
          for p in \
            "$HOME/yandex-cloud/bin/yc" \
            "/home/runner/yandex-cloud/bin/yc" \
            "/usr/local/bin/yc" \
            "/usr/bin/yc" \
            "$HOME/.local/bin/yc"; do
            if [ -x "$p" ]; then YC_BIN="$p"; break; fi
          done

          if [ -z "$YC_BIN" ]; then
            YC_BIN="$(command -v yc 2>/dev/null || true)"
          fi

          if [ -z "$YC_BIN" ]; then
            FOUND="$(find / -maxdepth 8 -type f -name yc 2>/dev/null | head -n 1 || true)"
            if [ -n "$FOUND" ] && [ -x "$FOUND" ]; then
              YC_BIN="$FOUND"
            fi
          fi

          if [ -z "$YC_BIN" ]; then
            echo "Failed to install or locate yc CLI."
            echo "Diagnostics:"
            ls -la "$HOME/yandex-cloud/bin" 2>/dev/null || true
            ls -la /usr/local/bin/yc 2>/dev/null || true
            ls -la "$HOME/.local/bin/yc" 2>/dev/null || true
            exit 1
          fi

          echo "Found yc at: $YC_BIN"
          echo "YC_BIN=$YC_BIN" >> "$GITHUB_ENV"
          "$YC_BIN" --version

      - name: Verify SA key file
        run: |
          set -e
          KEY_PATH="$(pwd)/key.json"
          if [ ! -s "$KEY_PATH" ]; then
            echo "key.json is missing or empty"
            exit 1
          fi
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "key.json present: $(wc -c < "$KEY_PATH") bytes"

      - name: Deploy new revision to serverless container
        run: |
          set -e
          "$YC_BIN" \
            --service-account-key "$KEY_PATH" \
            --cloud-id "${{ secrets.YC_CLOUD_ID }}" \
            --folder-id "${{ secrets.YC_FOLDER_ID }}" \
            serverless container revision deploy \
              --container-id ${{ secrets.YC_SERVERLESS_CONTAINER_ID }} \
              --image "$IMAGE_URI" \
              --cores 1 \
              --memory 1GB \
              --execution-timeout 60s \
              --environment PORT=8080 \
              --environment APP_ENV=prod \
              --environment YC_BUCKET_NAME=${{ secrets.YC_BUCKET_NAME }}
